<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coach AI — Dashboard</title>
<link rel="stylesheet" href="screens.css" />
<link rel="stylesheet" href="dashboard.css" />
<style>
  body { background: #0A0A0C; }

  /* Prototype host */
  .proto-stage {
    position: fixed; inset: 0;
    background: #0A0A0C;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .proto-stage::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(74,83,255,0.10) 0%, transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(157,92,255,0.06) 0%, transparent 50%);
    pointer-events: none;
  }
  .proto-shell {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .proto-meta {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-sans);
    color: rgba(255,255,255,0.55);
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .proto-meta .dot { width: 6px; height: 6px; border-radius: 50%; background: #4A53FF; }
  .proto-meta .step { color: rgba(255,255,255,0.85); }

  /* Canvas mode */
  .canvas-mode { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>

<script type="text/babel">
const { useState } = React;
const { DashboardScreen, IOSFrame } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "view": "canvas",
  "state": "loaded",
  "period": "day"
}/*EDITMODE-END*/;

function PrototypeMode({ tweaks }) {
  return (
    <div className="proto-stage">
      <div className="proto-shell">
        <div className="proto-meta">
          <span className="dot"></span>
          <span>Coach AI · Dashboard</span>
          <span style={{ opacity: 0.4 }}>—</span>
          <span className="step">app/(tabs)/index.tsx</span>
        </div>
        <IOSFrame>
          <DashboardScreen
            key={tweaks.state + "-" + tweaks.period}
            loading={tweaks.state === "loading"}
            empty={tweaks.state === "empty"}
            offline={tweaks.state === "offline"}
            initialPeriod={tweaks.period}
          />
        </IOSFrame>
      </div>
    </div>
  );
}

const AB_W = 412;
const AB_H = 866;

function Artboard({ children }) {
  return (
    <div style={{ width: AB_W, height: AB_H, display: "flex",
                  alignItems: "center", justifyContent: "center" }}>
      <IOSFrame>{children}</IOSFrame>
    </div>
  );
}

function CanvasMode() {
  return (
    <div className="canvas-mode">
      <DesignCanvas>
        <DCSection
          id="dashboard-main"
          title="Coach AI · Dashboard — vue principale"
          subtitle="app/(tabs)/index.tsx — header, insight RAG, activité, cas d'usage, alertes, tab bar."
        >
          <DCArtboard id="dash-day"   label="Période · Jour"    width={AB_W} height={AB_H}>
            <Artboard><DashboardScreen initialPeriod="day" /></Artboard>
          </DCArtboard>
          <DCArtboard id="dash-week"  label="Période · Semaine" width={AB_W} height={AB_H}>
            <Artboard><DashboardScreen initialPeriod="week" /></Artboard>
          </DCArtboard>
          <DCArtboard id="dash-month" label="Période · Mois"    width={AB_W} height={AB_H}>
            <Artboard><DashboardScreen initialPeriod="month" /></Artboard>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="dashboard-states"
          title="États transverses"
          subtitle="Loading initial, premier jour (empty), hors ligne."
        >
          <DCArtboard id="dash-loading" label="Loading initial" width={AB_W} height={AB_H}>
            <Artboard><DashboardScreen loading={true} /></Artboard>
          </DCArtboard>
          <DCArtboard id="dash-empty"   label="Premier jour"    width={AB_W} height={AB_H}>
            <Artboard><DashboardScreen empty={true} /></Artboard>
          </DCArtboard>
          <DCArtboard id="dash-offline" label="Hors ligne"      width={AB_W} height={AB_H}>
            <Artboard><DashboardScreen offline={true} /></Artboard>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </div>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      {tweaks.view === "prototype"
        ? <PrototypeMode tweaks={tweaks} />
        : <CanvasMode />}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Mode d'affichage">
          <TweakRadio
            label="Vue"
            value={tweaks.view}
            onChange={v => setTweak("view", v)}
            options={[
              { value: "prototype", label: "Prototype" },
              { value: "canvas", label: "Canvas" },
            ]}
          />
        </TweakSection>

        <TweakSection title="Période active">
          <TweakRadio
            label="Range"
            value={tweaks.period}
            onChange={v => setTweak("period", v)}
            options={[
              { value: "day",   label: "Jour" },
              { value: "week",  label: "Semaine" },
              { value: "month", label: "Mois" },
            ]}
          />
        </TweakSection>

        <TweakSection title="État">
          <TweakRadio
            label="Variante"
            value={tweaks.state}
            onChange={v => setTweak("state", v)}
            options={[
              { value: "loaded",  label: "Chargé" },
              { value: "loading", label: "Loading" },
              { value: "empty",   label: "Premier jour" },
              { value: "offline", label: "Hors ligne" },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
